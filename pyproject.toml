[project]
name = "byteplus-image-mcp"
version = "2.0.0"
description = "MCP server untuk generate image via BytePlus ModelArk (Dola-Seedream 5.0) — logo, mockup UI/UX, ilustrasi dokumen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mas Wondho", email = "wondho@dutacorpora.co.id" },
]
keywords = ["mcp", "byteplus", "seedream", "image-generation", "model-context-protocol"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
byteplus-image-mcp = "byteplus_image_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alecslacker/byteplus-image-mcp"
Repository = "https://github.com/alecslacker/byteplus-image-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/byteplus_image_mcp"]
